<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Dept. PMIS_Don V2.5 | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .stat-card { @apply bg-white rounded-xl shadow p-4 flex items-center justify-between border-l-4; }
            .dash-card { @apply bg-white rounded-xl shadow-sm p-5 hover:shadow-md transition-all border border-gray-100; }
        }
        body { background-color: #F8FAFC; margin: 0; }
        .sidebar-iframe { width: 260px; height: 100vh; border: none; position: fixed; transition: all 0.3s ease; }
        .main-content { margin-left: 260px; transition: all 0.3s ease; }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe"></iframe>

    <div class="main-content">
        <header class="bg-white shadow-sm px-6 py-4 sticky top-0">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <button id="toggleSidebar" class="mr-4 text-gray-500 hover:text-gray-800 text-lg p-1 rounded hover:bg-gray-100">
                        <i class="fa fa-bars"></i>
                    </button>
                    <h2 class="text-gray-800 font-semibold">儀表盤總覽</h2>
                </div>
                <div class="flex items-center gap-3">
                    <i class="fa fa-bell-o text-gray-500 text-lg"></i>
                    <div class="flex items-center">
                        <i class="fa fa-user-circle-o text-gray-500 text-xl mr-2"></i>
                        <span class="text-sm text-gray-600">ID Dept. User</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
                <div class="stat-card border-primary">
                    <div>
                        <p class="text-gray-500 text-sm">總項目數</p>
                        <p class="text-2xl font-bold text-gray-800" id="totalProj">0</p>
                    </div>
                    <i class="fa fa-folder text-3xl text-primary/30"></i>
                </div>
                <div class="stat-card border-success">
                    <div>
                        <p class="text-gray-500 text-sm">進行中</p>
                        <p class="text-2xl font-bold text-gray-800" id="inProgress">0</p>
                    </div>
                    <i class="fa fa-spinner text-3xl text-success/30"></i>
                </div>
                <div class="stat-card border-warning">
                    <div>
                        <p class="text-gray-500 text-sm">規劃中</p>
                        <p class="text-2xl font-bold text-gray-800" id="planning">0</p>
                    </div>
                    <i class="fa fa-clock-o text-3xl text-warning/30"></i>
                </div>
                <div class="stat-card border-success">
                    <div>
                        <p class="text-gray-500 text-sm">已完成</p>
                        <p class="text-2xl font-bold text-gray-800" id="completed">0</p>
                    </div>
                    <i class="fa fa-check-circle text-3xl text-success/30"></i>
                </div>
            </div>

            <div class="dash-card">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-gray-800">最近項目</h3>
                    <a href="main.html" class="text-primary text-sm hover:underline">查看全部</a>
                </div>
                <div id="recentList" class="space-y-3">
                    <p class="text-gray-500 text-center py-6">暫無項目數據</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function getProjects(){
                return JSON.parse(localStorage.getItem('pmis_projects')) || [];
            }
            const projects = getProjects();
            document.getElementById('totalProj').innerText = projects.length;
            document.getElementById('inProgress').innerText = projects.filter(p=>p.status==='In Progress').length;
            document.getElementById('planning').innerText = projects.filter(p=>p.status==='Planning').length;
            document.getElementById('completed').innerText = projects.filter(p=>p.status==='Completed').length;

            const recent = projects.slice(-5).reverse();
            const container = document.getElementById('recentList');
            if(recent.length>0){
                container.innerHTML = recent.map(p=>`
                    <div class="flex justify-between items-center py-2 border-b">
                        <div>
                            <span class="font-medium text-primary">${p.id}</span>
                            <span class="ml-2">${p.name}</span>
                        </div>
                        <span class="text-xs px-2 py-1 rounded-full ${
                            p.status==='Completed'?'bg-green-100 text-green-600':
                            p.status==='In Progress'?'bg-blue-100 text-blue-600':'bg-gray-100 text-gray-600'
                        }">${p.status}</span>
                    </div>
                `).join('');
            }

            // Sidebar 切換（預設顯示）
            let isHidden = localStorage.getItem('sidebarHidden') === 'true';
            const sidebarIframe = document.querySelector('.sidebar-iframe');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.getElementById('toggleSidebar');

            function toggleSidebar() {
                isHidden = !isHidden;
                localStorage.setItem('sidebarHidden', isHidden);
                
                if (isHidden) {
                    sidebarIframe.style.width = '0';
                    mainContent.style.marginLeft = '0';
                } else {
                    sidebarIframe.style.width = '260px';
                    mainContent.style.marginLeft = '260px';
                }
            }

            if (isHidden) {
                sidebarIframe.style.width = '0';
                mainContent.style.marginLeft = '0';
            }

            toggleBtn.addEventListener('click', toggleSidebar);
        });
    </script>
</body>
</html>
