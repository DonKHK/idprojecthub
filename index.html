<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Dept. PMIS_Don V2.5 | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="textailwindcss">
        @layer utilities {
            .card-hover {
                @apply transition-all duration-300 hover:-translate-y-2;
            }
            .gradient-bg {
                background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%);
            }
            .status-badge { @apply px-2.5 py-1 rounded-full text-xs font-medium; }
        }
    </style>
    <style>
        body { 
            background-color: #F8FAFC; 
            margin: 0; 
            font-family: 'Inter', system-ui, sans-serif;
        }
        .sidebar-iframe { 
            width: 44px; 
            height: 100vh; 
            border: none; 
            position: fixed; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 10;
            background: #ffffff;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }
        .main-content { 
            margin-left: 44px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        /* 核心：獨立統計卡片 - 強化陰影+徹底分離 */
        .stat-card {
            @apply bg-white rounded-2xl shadow-2xl transition-all duration-300 p-7 border border-gray-100 card-hover;
        }
        .project-card {
            @apply bg-white rounded-xl shadow-sm hover:shadow-md transition-all p-5 border border-gray-100 card-hover;
        }
        .dashboard-header {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95) !important;
        }
    </style>
</head>
<body class="gradient-bg">
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>

    <div class="main-content min-h-screen">
        <header class="dashboard-header shadow-sm px-6 py-5 sticky top-0 z-20">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <button id="toggleSidebar" class="text-gray-600 hover:text-primary text-2xl p-2 rounded-xl hover:bg-primary/5 transition-all">
                        <i class="fa fa-bars"></i>
                    </button>
                    <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Dashboard</h2>
                </div>
            </div>
        </header>

        <main class="p-6 max-w-7xl mx-auto pb-12">
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800 tracking-tight">歡迎回來 👋</h1>
                <p class="text-gray-500 mt-1 text-lg">項目概覽與實時數據</p>
            </div>

            <!-- ========== 4個完全獨立分離的統計板塊 (重點優化) ========== -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10 mb-12">
                <!-- 總項目數 - 獨立藍色板塊 -->
                <div class="stat-card border-l-4 border-primary">
                    <div class="flex flex-col">
                        <p class="text-gray-500 text-sm font-medium mb-3">總項目數</p>
                        <div class="flex justify-between items-end">
                            <p class="text-6xl font-bold text-primary" id="totalProj">0</p>
                            <i class="fa fa-folder-open text-5xl text-primary/20"></i>
                        </div>
                    </div>
                </div>

                <!-- 進行中 - 獨立深藍板塊 -->
                <div class="stat-card border-l-4 border-blue-600">
                    <div class="flex flex-col">
                        <p class="text-gray-500 text-sm font-medium mb-3">進行中</p>
                        <div class="flex justify-between items-end">
                            <p class="text-6xl font-bold text-blue-600" id="inProgress">0</p>
                            <i class="fa fa-spinner text-5xl text-blue-600/20"></i>
                        </div>
                    </div>
                </div>

                <!-- 規劃中 - 獨立橙色板塊 -->
                <div class="stat-card border-l-4 border-warning">
                    <div class="flex flex-col">
                        <p class="text-gray-500 text-sm font-medium mb-3">規劃中</p>
                        <div class="flex justify-between items-end">
                            <p class="text-6xl font-bold text-warning" id="planning">0</p>
                            <i class="fa fa-clock-o text-5xl text-warning/20"></i>
                        </div>
                    </div>
                </div>

                <!-- 已完成 - 獨立綠色板塊 -->
                <div class="stat-card border-l-4 border-success">
                    <div class="flex flex-col">
                        <p class="text-gray-500 text-sm font-medium mb-3">已完成</p>
                        <div class="flex justify-between items-end">
                            <p class="text-6xl font-bold text-success" id="completed">0</p>
                            <i class="fa fa-check-circle text-5xl text-success/20"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 所有項目列表 - 板塊展示 -->
            <div class="bg-white rounded-2xl shadow-lg p-6 card-hover">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-gray-800 tracking-tight">所有項目</h3>
                </div>
                <div id="allProjectsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- 所有項目自動渲染呢度 -->
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function getProjects(){ return JSON.parse(localStorage.getItem('pmis_projects')) || []; }
            const projects = getProjects();

            // 統計數據
            document.getElementById('totalProj').innerText = projects.length;
            document.getElementById('inProgress').innerText = projects.filter(p => p.status === 'In Progress').length;
            document.getElementById('planning').innerText = projects.filter(p => p.status === 'Planning').length;
            document.getElementById('completed').innerText = projects.filter(p => p.status === 'Completed').length;

            // 渲染【所有項目】卡片
            const container = document.getElementById('allProjectsList');
            if(projects.length === 0){
                container.innerHTML = '<p class="text-gray-500 text-center col-span-full py-10">暫無項目</p>';
            } else {
                container.innerHTML = projects.map(project => {
                    const statusClass = project.status === 'Completed' 
                        ? 'bg-success/10 text-success' 
                        : project.status === 'In Progress' 
                            ? 'bg-primary/10 text-primary' 
                            : 'bg-gray-100 text-gray-600';
                    
                    const statusText = project.status === 'Completed' 
                        ? '已完成' 
                        : project.status === 'In Progress' 
                            ? '進行中' 
                            : '規劃中';

                    return `
                    <a href="detail_project.html?id=${project.id}" class="block project-card">
                        <div class="flex justify-between items-start mb-3">
                            <h4 class="font-bold text-gray-800">${project.id || '未命名'} - ${project.name || '未設定'}</h4>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="text-sm text-gray-500 space-y-1">
                            <p>負責人：${project.owner || '未設定'}</p>
                            <p>日期：${project.startDate || '未設定'} ~ ${project.endDate || '未設定'}</p>
                            <p class="truncate">描述：${project.description || '無描述'}</p>
                        </div>
                    </a>
                    `;
                }).join('');
            }

            // Sidebar 控制
            let isCollapsed = localStorage.getItem('sidebarCollapsed') !== 'false';
            const sidebarIframe = document.getElementById('sidebarFrame');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.getElementById('toggleSidebar');

            function updateSidebar() {
                const w = isCollapsed ? '44px' : '260px';
                const m = isCollapsed ? '44px' : '260px';
                sidebarIframe.style.width = w;
                mainContent.style.marginLeft = m;
                try {
                    const doc = sidebarIframe.contentWindow.document.documentElement;
                    if (doc) isCollapsed ? doc.classList.add('sidebar-collapsed') : doc.classList.remove('sidebar-collapsed');
                } catch(e){}
            }

            toggleBtn.addEventListener('click', () => {
                isCollapsed = !isCollapsed;
                localStorage.setItem('sidebarCollapsed', isCollapsed);
                updateSidebar();
            });

            sidebarIframe.addEventListener('load', () => setTimeout(updateSidebar, 100));
            updateSidebar();
        });
    </script>
</body>
</html>
