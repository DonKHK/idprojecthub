<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待審批 Ideas | I&D Project Hub v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF' } } } }
    </script>
    <style>
        body { background: #f8fafc; margin: 0; }
        .sidebar-iframe { width: 54px; height: 100vh; border: none; position: fixed; transition: all 0.4s ease; z-index: 50; }
        .main-content { margin-left: 54px; transition: all 0.4s ease; }
        .idea-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: all 0.3s; }
        .idea-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(22,93,255,0.15); }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>
    <div class="main-content min-h-screen">
        <header class="bg-white shadow-sm px-8 py-6 sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button id="toggleSidebar" class="text-3xl p-2 hover:bg-slate-100 rounded-2xl">
                    <i class="fa fa-bars"></i>
                </button>
                <h2 class="text-3xl font-bold text-slate-900">待審批項目</h2>
            </div>
        </header>
        <main class="p-8">
            <div id="pendingList" class="space-y-6"></div>
        </main>
    </div>

    <!-- AI 結果 Modal -->
    <div id="aiModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100]">
        <div class="bg-white rounded-3xl max-w-3xl w-full mx-4 max-h-[90vh] overflow-auto">
            <div class="p-8">
                <div class="flex justify-between mb-6">
                    <h3 class="text-2xl font-bold">AI 分析結果</h3>
                    <button onclick="closeAIModal()" class="text-4xl text-slate-400 hover:text-slate-600">×</button>
                </div>
                <div id="aiResult" class="prose text-slate-700 max-h-[60vh] overflow-auto"></div>
                <div id="saveArea" class="mt-8 hidden flex gap-3">
                    <button onclick="saveAnalysis()" class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl hover:bg-emerald-700 font-medium">
                        ✅ 儲存分析結果到此 Idea
                    </button>
                    <button onclick="closeAIModal()" class="flex-1 py-4 border border-slate-300 rounded-2xl hover:bg-slate-100">
                        暫不儲存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAnalyzedIdea = null;
        const CURRENT_MODEL = "gpt-oss-120b (free)";
        const MODEL_ID = "gpt-oss-120b:free";

        async function aiAnalyze(idea) {
            currentAnalyzedIdea = idea;

            // === 每次都詢問 API Key ===
            const apiKey = window.prompt('請輸入你的 OpenRouter API Key：');

            if (!apiKey || apiKey.trim() === '') {
                alert('❌ 未輸入 API Key，操作已取消。');
                return;
            }

            const prompt = `請用繁體中文，專業分析以下 Idea：\n\n【ID】${idea.id}\n【名稱】${idea.projectTitle || '未填寫'}\n【背景】${idea.projectBackground || '未填寫'}\n【痛點】${idea.painPoints || '未填寫'}\n【範圍】${idea.projectScope || '未填寫'}\n【預算】HK$ ${idea.totalBudget || '未填寫'}\n\n請回答：1.總結 2.市場現況 3.主要風險 4.推進建議`;

            const modal = document.getElementById('aiModal');
            const resultDiv = document.getElementById('aiResult');
            const saveArea = document.getElementById('saveArea');

            resultDiv.innerHTML = `<p class="text-slate-500">正在呼叫 ${CURRENT_MODEL} 分析中...</p>`;
            saveArea.classList.add('hidden');
            modal.classList.remove('hidden');

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'I&D Project Hub',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL_ID,
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `HTTP 錯誤 ${response.status}`);
                }

                const data = await response.json();
                const resultText = data.choices?.[0]?.message?.content || "AI 沒有回應";

                resultDiv.innerHTML = `<div class="prose prose-slate">${resultText.replace(/\n/g, '<br>')}</div>`;
                saveArea.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = `
                    <p class="text-red-600 font-medium">AI 呼叫失敗</p>
                    <p class="text-sm text-slate-500 mt-2">${err.message}</p>
                    <p class="text-xs text-slate-400 mt-4">可能原因：API Key 錯誤、額度不足、或網絡問題</p>
                `;
                saveArea.classList.add('hidden');
            }
        }

        window.saveAnalysis = function() {
            if (!currentAnalyzedIdea) return;
            const now = new Date();
            const timestamp = now.toLocaleString('zh-HK', { hour12: false });

            let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
            const target = ideas.find(i => i.id === currentAnalyzedIdea.id);

            if (target) {
                target.aiAnalysis = document.getElementById('aiResult').innerText;
                target.aiAnalysisTime = timestamp;
                target.aiAnalysisModel = CURRENT_MODEL;
                localStorage.setItem('pmis_ideas', JSON.stringify(ideas));
                alert('✅ 已成功儲存 AI 分析結果！');
                closeAIModal();
                loadAllIdeas();
            }
        };

        function closeAIModal() {
            document.getElementById('aiModal').classList.add('hidden');
            currentAnalyzedIdea = null;
        }

        function showStoredAnalysis(idea) {
            const modal = document.getElementById('aiModal');
            const resultDiv = document.getElementById('aiResult');
            resultDiv.innerHTML = `
                <p class="text-xs text-slate-500 mb-1">分析時間：${idea.aiAnalysisTime}</p>
                <p class="text-xs text-violet-600 mb-4">使用模型：${idea.aiAnalysisModel || '未知'}</p>
                <div class="prose">${(idea.aiAnalysis || '').replace(/\n/g, '<br>')}</div>
            `;
            document.getElementById('saveArea').classList.add('hidden');
            modal.classList.remove('hidden');
        }

        function aiAnalyzeFromCard(ideaId) {
            let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
            const idea = ideas.find(i => i.id === ideaId);
            if (idea) aiAnalyze(idea);
        }

        function showStoredFromCard(ideaId) {
            let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
            const idea = ideas.find(i => i.id === ideaId);
            if (idea && idea.aiAnalysis) showStoredAnalysis(idea);
        }

        function loadAllIdeas() {
            let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
            const container = document.getElementById('pendingList');

            if (ideas.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-20">暫無項目申請</p>`;
                return;
            }

            container.innerHTML = ideas.map(idea => {
                let statusHTML = '';
                if (idea.status === 'pending') {
                    statusHTML = `
                        <button onclick="approveIdea('${idea.id}')" class="px-6 py-3 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 text-sm font-medium">批准</button>
                        <button onclick="aiAnalyzeFromCard('${idea.id}')" class="px-6 py-3 bg-violet-600 text-white rounded-xl hover:bg-violet-700 text-sm font-medium flex items-center gap-2">
                            <i class="fa fa-magic"></i> AI 分析
                        </button>`;
                }

                let analysisBtn = '';
                if (idea.aiAnalysis) {
                    analysisBtn = `
                        <button onclick="showStoredFromCard('${idea.id}')" class="px-6 py-3 bg-amber-600 text-white rounded-xl hover:bg-amber-700 text-sm font-medium flex items-center gap-2">
                            <i class="fa fa-chart-bar"></i> 查看 AI 分析結果
                        </button>`;
                }

                return `
                <div class="idea-card p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <a href="idea_detail.html?id=${idea.id}" class="text-xs font-mono bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded-full inline-block transition-colors">
                                ${idea.id}
                            </a>
                            <h3 class="font-bold text-xl mt-3">${idea.projectTitle || '未命名 Idea'}</h3>
                            <p class="text-sm text-gray-500 mt-1">提交：${idea.submitDate} ${idea.submitTime || ''}</p>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            ${statusHTML}
                            ${analysisBtn}
                            <button onclick="deleteIdea('${idea.id}')" class="px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mt-4 text-sm text-gray-600 line-clamp-3">
                        ${idea.projectBackground || idea.painPoints || '無描述'}
                    </div>
                </div>`;
            }).join('');
        }

        window.approveIdea = function(ideaId) {
            let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
            const idea = ideas.find(i => i.id === ideaId);
            if (idea) {
                idea.status = 'approved';
                idea.approvedDateTime = new Date().toLocaleString('zh-HK', { hour12: false });
                localStorage.setItem('pmis_ideas', JSON.stringify(ideas));
                alert('✅ 已批准此 Idea！');
                loadAllIdeas();
            }
        };

        window.deleteIdea = function(ideaId) {
            if (!confirm('確定要刪除這個 Idea 嗎？')) return;
            let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
            ideas = ideas.filter(i => i.id !== ideaId);
            localStorage.setItem('pmis_ideas', JSON.stringify(ideas));
            alert('🗑️ Idea 已刪除');
            loadAllIdeas();
        };

        // 初始化
        loadAllIdeas();

        // Sidebar 控制
        const sidebar = document.getElementById('sidebarFrame');
        const mainContent = document.querySelector('.main-content');
        const toggleBtn = document.getElementById('toggleSidebar');
        let isCollapsed = localStorage.getItem('sidebarCollapsed') !== 'false';

        function updateSidebar() {
            const w = isCollapsed ? '54px' : '260px';
            const m = isCollapsed ? '54px' : '260px';
            sidebar.style.width = w;
            mainContent.style.marginLeft = m;
        }

        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            localStorage.setItem('sidebarCollapsed', isCollapsed);
            updateSidebar();
        });

        sidebar.addEventListener('load', () => setTimeout(updateSidebar, 150));
        updateSidebar();
    </script>
</body>
</html>
