<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sidebarBg: '#1E293B',
                        primary: '#165DFF',
                        lightText: '#94A3B8'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .sidebar-link { @apply flex items-center px-4 py-3 text-lightText hover:text-white hover:bg-primary/20 rounded-md mx-2 transition-all; }
            .sidebar-link.active { @apply bg-primary/20 text-white border-l-4 border-primary; }
        }
        body { margin: 0; background-color: #1E293B; height: 100vh; overflow-x: hidden; }
    </style>
</head>
<body>
    <div class="flex flex-col h-full">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-white font-bold text-lg">PMIS_Don V2.5</h1>
            <p class="text-lightText text-xs">ID Dept. Project System</p>
        </div>
        
        <nav class="mt-4 flex-1">
            <a href="index.html" target="_parent" class="sidebar-link" data-page="index">
                <i class="fa fa-dashboard w-5 text-center"></i>
                <span class="ml-2">Dashboard 主頁</span>
            </a>
            <a href="main.html" target="_parent" class="sidebar-link" data-page="main">
                <i class="fa fa-folder-open w-5 text-center"></i>
                <span class="ml-2">我的項目</span>
            </a>
            <a href="create_project.html" target="_parent" class="sidebar-link" data-page="create">
                <i class="fa fa-plus-circle w-5 text-center"></i>
                <span class="ml-2">新增項目</span>
            </a>
            
            <div class="border-t border-gray-700 my-4 mx-2"></div>
            
            <a href="notes.html" target="_parent" class="sidebar-link" data-page="notes">
                <i class="fa fa-exclamation-triangle w-5 text-center"></i>
                <span class="ml-2">需注意事項</span>
            </a>
            <a href="ideas.html" target="_parent" class="sidebar-link" data-page="ideas">
                <i class="fa fa-lightbulb-o w-5 text-center"></i>
                <span class="ml-2">提供 Idea</span>
            </a>
            <a href="funding.html" target="_parent" class="sidebar-link" data-page="funding">
                <i class="fa fa-money w-5 text-center"></i>
                <span class="ml-2">政府 Funding</span>
            </a>
        </nav>
    </div>

    <script>
        // 自動高亮當前頁面
        window.onload = function() {
            const currentPage = window.parent.location.pathname.split('/').pop().replace('.html', '');
            document.querySelectorAll('.sidebar-link').forEach(link => {
                if (link.dataset.page === currentPage) {
                    link.classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
