<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF'
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            margin: 0; 
            background-color: #1E293B; 
            height: 100vh; 
            overflow-x: hidden; 
        }
        
        .sidebar-link { 
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: #E6ECF7;
            transition: all 0.3s;
            margin: 2px 8px;
            border-radius: 6px;
        }
        .sidebar-link:hover {
            background-color: rgba(22, 93, 255, 0.2);
            color: white;
        }
        .sidebar-link i {
            width: 24px;
            color: #E6ECF7;
        }
        .sidebar-link:hover i,
        .sidebar-link.active i {
            color: white;
        }
        .sidebar-link.active { 
            background-color: rgba(22, 93, 255, 0.25);
            color: white;
            border-left: 4px solid #165DFF;
        }

        .sidebar-text {
            margin-left: 12px;
            white-space: nowrap;
        }

        /* 收窄模式 (只顯示 Icon) */
        .sidebar-collapsed .sidebar-text {
            display: none !important;
        }
        .sidebar-collapsed {
            width: 44px !important;
        }
        .sidebar-collapsed .sidebar-link {
            justify-content: center;
            padding: 12px 0;
        }
    </style>
</head>
<body>
    <div id="sidebar" class="flex flex-col h-full transition-all duration-300">
        <!-- Logo -->
        <div class="p-4 border-b border-gray-700 flex items-center justify-center">
            <div class="w-8 h-8 bg-primary rounded-xl flex items-center justify-center text-white font-bold text-xl">
                P
            </div>
        </div>
        
        <nav class="mt-6 flex-1 space-y-1">
            <a href="index.html" target="_parent" class="sidebar-link" data-page="index">
                <i class="fa fa-dashboard w-6"></i>
                <span class="sidebar-text">Dashboard 主頁</span>
            </a>
            <a href="main.html" target="_parent" class="sidebar-link" data-page="main">
                <i class="fa fa-folder-open w-6"></i>
                <span class="sidebar-text">我的項目</span>
            </a>
            <a href="create_project.html" target="_parent" class="sidebar-link" data-page="create">
                <i class="fa fa-plus-circle w-6"></i>
                <span class="sidebar-text">新增項目</span>
            </a>
            
            <div class="border-t border-gray-700 my-6 mx-4"></div>
            
            <a href="notes.html" target="_parent" class="sidebar-link" data-page="notes">
                <i class="fa fa-exclamation-triangle w-6"></i>
                <span class="sidebar-text">需注意事項</span>
            </a>
            <a href="ideas.html" target="_parent" class="sidebar-link" data-page="ideas">
                <i class="fa fa-lightbulb-o w-6"></i>
                <span class="sidebar-text">提供 Idea</span>
            </a>
            <a href="funding.html" target="_parent" class="sidebar-link" data-page="funding">
                <i class="fa fa-money w-6"></i>
                <span class="sidebar-text">政府 Funding</span>
            </a>
        </nav>
    </div>

    <script>
        window.onload = function() {
            const currentPage = window.parent.location.pathname.split('/').pop().replace('.html', '') || 'index';
            document.querySelectorAll('.sidebar-link').forEach(link => {
                if (link.dataset.page === currentPage) {
                    link.classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
