<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF' } } } }
    </script>
    <style>
        body { margin: 0; height: 100vh; overflow-x: hidden; background-color: #1E293B; }
        .sidebar-link {
            display: flex; align-items: center; padding: 14px 16px;
            color: #E6ECF7; transition: all 0.3s; margin: 2px 8px; border-radius: 8px;
        }
        .sidebar-link:hover:not(.disabled) { background-color: rgba(22, 93, 255, 0.25); color: white; }
        .sidebar-link.disabled { opacity: 0.45; pointer-events: none; cursor: not-allowed; }
        .sidebar-link i { width: 24px; }
        .sidebar-text { margin-left: 12px; white-space: nowrap; }
        .logo-img { width: 42px; height: 42px; object-fit: contain; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="sidebar" class="flex flex-col h-full transition-all duration-300 bg-[#1E293B] text-white">
        <!-- Logo -->
        <div class="p-4 border-b border-gray-700 flex items-center justify-center">
            <img src="AAI_logo.jpg" alt="AAI Logo" class="logo-img">
        </div>
        <nav class="mt-6 flex-1 space-y-1 px-2" id="menuContainer"></nav>
        
        <!-- 開發者區域 -->
        <div onclick="handleDevClick()" id="devArea"
             class="mt-0 pt-4 px-4 pb-4 border-t border-gray-700 text-xs text-slate-400 text-center leading-tight cursor-pointer hover:text-slate-300 select-none">
            開發者<br>
            Don Kwan<br>
            37985724<br>
            <a href="mailto:don.kwan@asiaalliedgroup.com" class="hover:text-slate-300">e-mail</a>
        </div>
    </div>

    <!-- 開發者登入 Modal -->
    <div id="devModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[9999]">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm mx-4">
            <h3 class="text-xl font-bold text-center mb-6">開發者登入 (SuperAdmin)</h3>
            <input id="devPassword" type="password" placeholder="輸入開發者密碼"
                   class="w-full px-5 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg mb-6">
            <div class="flex gap-4">
                <button onclick="cancelDevLogin()" class="flex-1 py-4 border border-slate-300 rounded-2xl font-medium">取消</button>
                <button onclick="devLogin()" class="flex-1 py-4 bg-[#165DFF] text-white rounded-2xl font-medium">登入</button>
            </div>
        </div>
    </div>

    <script>
        const level = localStorage.getItem('accessLevel') || 'guest';
        let devClickCount = 0;
        let lastClickTime = 0;

        function handleDevClick() {
            const now = Date.now();
            if (now - lastClickTime > 2000) { devClickCount = 0; }
            lastClickTime = now;
            devClickCount++;
            if (devClickCount === 5) {
                document.getElementById('devModal').classList.remove('hidden');
                document.getElementById('devPassword').focus();
                devClickCount = 0;
            }
        }

        function devLogin() {
            const pwd = document.getElementById('devPassword').value.trim();
            if (pwd === "96270630") {
                localStorage.setItem('accessLevel', 'superadmin');
                alert('✅ SuperAdmin 登入成功！\n已獲得最高權限');
                document.getElementById('devModal').classList.add('hidden');
                location.reload();
            } else {
                alert('❌ 密碼錯誤');
                document.getElementById('devPassword').value = '';
            }
        }

        function cancelDevLogin() {
            document.getElementById('devModal').classList.add('hidden');
            document.getElementById('devPassword').value = '';
        }

        // ====================== 新增：同步最新資料（所有用戶可用） ======================
        window.syncLatestData = async function() {
            if (!confirm('確定要從 GitHub 同步最新資料嗎？\n這會覆蓋目前本地所有資料。')) return;

            const originalHTML = event.target.innerHTML;
            event.target.innerHTML = `<i class="fa fa-spinner fa-spin"></i> 同步中...`;

            try {
                const res = await fetch("https://raw.githubusercontent.com/DonKHK/idprojecthub/main/backup/pmis_backup.json?t=" + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.pmis_projects) localStorage.setItem('pmis_projects', JSON.stringify(data.pmis_projects));
                    if (data.pmis_ideas) localStorage.setItem('pmis_ideas', JSON.stringify(data.pmis_ideas));
                    alert('✅ 同步成功！\n頁面刷新中...');
                    location.reload();
                } else {
                    alert('❌ 同步失敗');
                }
            } catch (e) {
                alert('❌ 網絡錯誤');
            }

            setTimeout(() => { event.target.innerHTML = originalHTML; }, 1500);
        };

        function buildMenu() {
            const container = document.getElementById('menuContainer');
            let html = '';
            const level = localStorage.getItem('accessLevel') || 'guest';

            if (level === 'superadmin') {
                // ==================== SUPERADMIN (最高權限) ====================
                html += `<a href="index.html" target="_parent" class="sidebar-link"><i class="fa fa-dashboard"></i><span class="sidebar-text">Dashboard</span></a>`;
                html += `<a href="main.html" target="_parent" class="sidebar-link"><i class="fa fa-folder-open"></i><span class="sidebar-text">我的項目</span></a>`;
                html += `<a href="all_projects.html" target="_parent" class="sidebar-link"><i class="fa fa-list"></i><span class="sidebar-text">項目總匯</span></a>`;
                html += `<a href="create_project.html" target="_parent" class="sidebar-link"><i class="fa fa-plus-circle"></i><span class="sidebar-text">新增項目</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                html += `<a href="ideas.html" target="_parent" class="sidebar-link"><i class="fa fa-lightbulb-o"></i><span class="sidebar-text">提交項目</span></a>`;
                html += `<a href="pending_ideas.html" target="_parent" class="sidebar-link"><i class="fa fa-clock-o"></i><span class="sidebar-text">待審批項目</span></a>`;
                html += `<a href="approved_ideas.html" target="_parent" class="sidebar-link"><i class="fa fa-check-circle"></i><span class="sidebar-text">已審批項目</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                html += `<a href="notes.html" target="_parent" class="sidebar-link"><i class="fa fa-exclamation-triangle"></i><span class="sidebar-text">需注意事項</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                html += `<a href="funding.html" target="_parent" class="sidebar-link"><i class="fa fa-dollar"></i><span class="sidebar-text">外界資助計劃</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                
                // 【新增】同步最新資料
                html += `<button onclick="syncLatestData()" class="sidebar-link w-full text-left text-emerald-400 hover:text-emerald-300"><i class="fa fa-refresh"></i><span class="sidebar-text">同步最新資料</span></button>`;
                
                html += `<button onclick="exportFullBackup()" class="sidebar-link w-full text-left"><i class="fa fa-download"></i><span class="sidebar-text">全系統備份</span></button>`;
                html += `<label class="sidebar-link w-full text-left cursor-pointer"><i class="fa fa-upload"></i><span class="sidebar-text">匯入備份</span><input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)"></label>`;

            } else if (level === 'admin') {
                // ==================== ADMIN (受限) ====================
                html += `<a href="index.html" target="_parent" class="sidebar-link"><i class="fa fa-dashboard"></i><span class="sidebar-text">Dashboard</span></a>`;
                html += `<a href="main.html" target="_parent" class="sidebar-link"><i class="fa fa-folder-open"></i><span class="sidebar-text">我的項目</span></a>`;
                html += `<a href="all_projects.html" target="_parent" class="sidebar-link"><i class="fa fa-list"></i><span class="sidebar-text">項目總匯</span></a>`;
                html += `<a href="#" class="sidebar-link disabled"><i class="fa fa-plus-circle"></i><span class="sidebar-text">新增項目</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                html += `<a href="ideas.html" target="_parent" class="sidebar-link"><i class="fa fa-lightbulb-o"></i><span class="sidebar-text">提交項目</span></a>`;
                html += `<a href="pending_ideas.html" target="_parent" class="sidebar-link"><i class="fa fa-clock-o"></i><span class="sidebar-text">待審批項目</span></a>`;
                html += `<a href="approved_ideas.html" target="_parent" class="sidebar-link"><i class="fa fa-check-circle"></i><span class="sidebar-text">已審批項目</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                html += `<a href="notes.html" target="_parent" class="sidebar-link"><i class="fa fa-exclamation-triangle"></i><span class="sidebar-text">需注意事項</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                html += `<a href="funding.html" target="_parent" class="sidebar-link"><i class="fa fa-dollar"></i><span class="sidebar-text">外界資助計劃</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                
                // 【新增】同步最新資料（Admin 也可以用）
                html += `<button onclick="syncLatestData()" class="sidebar-link w-full text-left text-emerald-400 hover:text-emerald-300"><i class="fa fa-refresh"></i><span class="sidebar-text">同步最新資料</span></button>`;
                
                // 保留你原本的禁用設定
                html += `<button onclick="alert('❌ Admin 無法使用全系統備份')" class="sidebar-link w-full text-left disabled"><i class="fa fa-download"></i><span class="sidebar-text">全系統備份</span></button>`;
                html += `<label class="sidebar-link w-full text-left cursor-pointer disabled"><i class="fa fa-upload"></i><span class="sidebar-text">匯入備份</span><input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)"></label>`;

            } else {
                // ==================== GUEST ====================
                html += `<a href="all_projects.html" target="_parent" class="sidebar-link"><i class="fa fa-list"></i><span class="sidebar-text">項目總匯</span></a>`;
                html += `<a href="ideas.html" target="_parent" class="sidebar-link"><i class="fa fa-lightbulb-o"></i><span class="sidebar-text">提交項目</span></a>`;
                html += `<a href="funding.html" target="_parent" class="sidebar-link"><i class="fa fa-dollar"></i><span class="sidebar-text">外界資助計劃</span></a>`;
                html += `<a href="#" class="sidebar-link disabled"><i class="fa fa-dashboard"></i><span class="sidebar-text">Dashboard</span></a>`;
                html += `<a href="#" class="sidebar-link disabled"><i class="fa fa-folder-open"></i><span class="sidebar-text">我的項目</span></a>`;
                html += `<a href="#" class="sidebar-link disabled"><i class="fa fa-plus-circle"></i><span class="sidebar-text">新增項目</span></a>`;
                html += `<a href="#" class="sidebar-link disabled"><i class="fa fa-clock-o"></i><span class="sidebar-text">待審批項目</span></a>`;
                html += `<a href="#" class="sidebar-link disabled"><i class="fa fa-check-circle"></i><span class="sidebar-text">已審批項目</span></a>`;
                html += `<a href="#" class="sidebar-link disabled"><i class="fa fa-exclamation-triangle"></i><span class="sidebar-text">需注意事項</span></a>`;
                html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
                
                // 【新增】同步最新資料（Guest 也可以用）
                html += `<button onclick="syncLatestData()" class="sidebar-link w-full text-left text-emerald-400 hover:text-emerald-300"><i class="fa fa-refresh"></i><span class="sidebar-text">同步最新資料</span></button>`;
                
                html += `<button onclick="alert('❌ 訪客無法使用備份功能')" class="sidebar-link w-full text-left disabled"><i class="fa fa-download"></i><span class="sidebar-text">全系統備份</span></button>`;
                html += `<label class="sidebar-link w-full text-left cursor-pointer disabled"><i class="fa fa-upload"></i><span class="sidebar-text">匯入備份</span><input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)"></label>`;
            }

            html += `<div class="border-t border-gray-700 my-6 mx-4"></div>`;
            html += `<button onclick="backToLogin()" class="sidebar-link w-full text-left text-red-400 hover:text-red-300"><i class="fa fa-sign-out"></i><span class="sidebar-text">返回登入頁面</span></button>`;

            container.innerHTML = html;
        }

        window.backToLogin = function() {
            if (confirm('確定要返回登入頁面嗎？')) {
                localStorage.removeItem('accessLevel');
                window.parent.location.href = 'login.html';
            }
        };

        window.onload = function() {
            buildMenu();
            autoLoadBackup();
        };

        function exportFullBackup() {
            const data = {
                exportDate: new Date().toISOString(),
                pmis_projects: JSON.parse(localStorage.getItem('pmis_projects') || '[]'),
                pmis_ideas: JSON.parse(localStorage.getItem('pmis_ideas') || '[]')
            };
            const now = new Date();
            const filename = `pmis_backup_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}.json`;
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
            alert(`✅ 備份成功！\n檔名：${filename}`);
        }

        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const backup = JSON.parse(ev.target.result);
                    if (backup.pmis_projects) localStorage.setItem('pmis_projects', JSON.stringify(backup.pmis_projects));
                    if (backup.pmis_ideas) localStorage.setItem('pmis_ideas', JSON.stringify(backup.pmis_ideas));
                    alert('✅ 匯入成功！頁面重新載入');
                    location.reload();
                } catch(err) {
                    alert('❌ 匯入失敗！');
                }
            };
            reader.readAsText(file);
        }

        async function autoLoadBackup() {
            const hasData = localStorage.getItem('pmis_ideas') || localStorage.getItem('pmis_projects');
            if (!hasData) {
                try {
                    const res = await fetch("https://raw.githubusercontent.com/DonKHK/idprojecthub/main/backup/pmis_backup.json?t=" + Date.now());
                    if (res.ok) {
                        const data = await res.json();
                        if (data.pmis_projects) localStorage.setItem('pmis_projects', JSON.stringify(data.pmis_projects));
                        if (data.pmis_ideas) localStorage.setItem('pmis_ideas', JSON.stringify(data.pmis_ideas));
                    }
                } catch (e) {}
            }
        }
    </script>
</body>
</html>
