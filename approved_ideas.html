<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已審批項目 | I&D Project Hub v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF' } } } }
    </script>
    <style>
        body { background: #f8fafc; margin: 0; }
        .sidebar-iframe { width: 54px; height: 100vh; border: none; position: fixed; transition: all 0.4s ease; z-index: 50; }
        .main-content { margin-left: 54px; transition: all 0.4s ease; }
        .idea-card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            transition: all 0.3s; 
        }
        .idea-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 20px 40px rgba(22,93,255,0.15); 
        }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>

    <div class="main-content min-h-screen">
        <header class="bg-white shadow-sm px-8 py-3 sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button id="toggleSidebar" class="text-3xl p-2 hover:bg-slate-100 rounded-2xl">
                    <i class="fa fa-bars"></i>
                </button>
                <h2 class="text-3xl font-bold text-slate-900">已審批項目</h2>
            </div>
        </header>

        <main class="p-8">
            <div id="approvedList" class="space-y-6"></div>
        </main>
    </div>

    <script>
        // 【加強版】Project ID 生成器（與 create_project.html 一致，避免重複）
        function generateProjectId() {
            const now = new Date();
            const yy = now.getFullYear().toString().slice(2);
            const mm = (now.getMonth() + 1).toString().padStart(2, '0');
            const prefix = yy + mm;

            let projects = JSON.parse(localStorage.getItem('pmis_projects')) || [];
            
            const existing = projects
                .filter(p => p.id && p.id.startsWith(prefix))
                .map(p => parseInt(p.id.slice(4), 10))
                .filter(n => !isNaN(n));

            const maxSeq = existing.length > 0 ? Math.max(...existing) : 0;
            const nextSeq = (maxSeq + 1).toString().padStart(2, '0');

            return prefix + nextSeq;
        }

        document.addEventListener('DOMContentLoaded', function() {
          function loadApprovedIdeas() {
    let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
    const container = document.getElementById('approvedList');
    const approved = ideas.filter(i => i.status === 'approved' || i.status === 'converted');
    const isAdmin = localStorage.getItem('accessLevel') === 'admin';
    const isSuperAdmin = localStorage.getItem('accessLevel') === 'superadmin';

    if (approved.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-center py-20">暫無已審批的 Idea</p>`;
        return;
    }

    container.innerHTML = approved.map(idea => {
        const approvedTime = idea.approvedDateTime || '—';
        let convertedInfo = '';

        if (idea.status === 'converted') {
            convertedInfo = `<br><span class="text-blue-600">已加入項目 ${idea.convertedProjectId || ''} (${idea.convertedDateTime || '—'})</span>`;
        }

        let actionButton = '';

        if (idea.status === 'converted') {
            actionButton = `<span class="px-5 py-2 bg-blue-100 text-blue-700 rounded-xl text-sm font-medium">已加入項目</span>`;
        } else {
            if (isSuperAdmin) {
                // SuperAdmin 可以正常使用
                actionButton = `
                    <button onclick="convertToProject('${idea.id}')" 
                            class="px-6 py-3 bg-primary text-white rounded-xl hover:bg-primary/90 flex items-center gap-2">
                        <i class="fa fa-plus"></i> 加入我的項目
                    </button>`;
            } else {
                // Admin 變灰色禁用
                actionButton = `
                    <button onclick="alert('❌ Admin 無法直接加入項目 (請使用 SuperAdmin)')" 
                            class="px-6 py-3 bg-slate-300 text-slate-500 rounded-xl cursor-not-allowed flex items-center gap-2">
                        <i class="fa fa-plus"></i> 加入我的項目
                    </button>`;
            }
        }

        return `
        <div class="idea-card p-6">
            <div class="flex justify-between items-start">
                <div>
                    <a href="idea_detail.html?id=${idea.id}" 
                       class="text-xs font-mono bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded-full inline-block transition-colors">
                        ${idea.id}
                    </a>
                    <h3 class="font-bold text-xl mt-3">${idea.projectTitle || '未命名 Idea'}</h3>
                    <p class="text-sm text-gray-500 mt-1">
                        提交：${idea.submitDate} ${idea.submitTime || ''}<br>
                        已審批：${approvedTime}
                        ${convertedInfo}
                    </p>
                </div>
                
                ${actionButton}
            </div>
            <div class="mt-4 text-sm text-gray-600 line-clamp-3">
                ${idea.projectBackground || idea.painPoints || '無描述'}
            </div>
        </div>`;
    }).join('');
}
            

window.convertToProject = function(ideaId) {
    let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
    let projects = JSON.parse(localStorage.getItem('pmis_projects')) || [];

    const idea = ideas.find(i => i.id === ideaId);
    if (!idea) {
        alert('找不到此 Idea');
        return;
    }

    const newProjectId = generateProjectId();
    const now = new Date();

    const newProject = {
        id: newProjectId,
        name: idea.projectTitle || '來自 Idea 的項目',
        description: idea.projectdes || idea.projectBackground || '',
        detail: [
            idea.projectBackground ? "背景：" + idea.projectBackground : '',
            idea.painPoints ? "痛點：" + idea.painPoints : '',
            idea.projectScope ? "範圍：" + idea.projectScope : '',
            idea.deliverables ? "交付成果：" + idea.deliverables : '',
            idea.benefits ? "預期效益：" + idea.benefits : '',
            idea.phase ? "實施階段：" + idea.phase : '',
            idea.othsupport ? "其他資源：" + idea.othsupport : '',
            idea.comments ? "備註：" + idea.comments : ''
        ].filter(Boolean).join('\n\n'),

        startDate: idea.start_date || '',        // ← 修正重點
        endDate: idea.target_date || '',         // ← 修正重點

        owner: idea.ownerName || idea.applicantName || '',
        manager: idea.pmName || '',
        support: idea.TechSupName || idea.techDirection || idea.othsupport || '',
        totalAmount: Number(idea.totalBudget) || 0,
        status: 'Planning',
        appliedGovernmentFunding: idea.govFund || '',
        projectTerminationFactor: idea.terminationFactor || '',
        createdFromIdea: idea.id,
        createdDate: now.toISOString(),
        phases: []
    };

    projects.push(newProject);
    localStorage.setItem('pmis_projects', JSON.stringify(projects));

    // 更新 Idea 狀態
    idea.status = 'converted';
    idea.convertedProjectId = newProjectId;
    idea.convertedDateTime = now.toLocaleString('zh-HK', { hour12: false });

    localStorage.setItem('pmis_ideas', JSON.stringify(ideas));

    alert(`✅ 已成功轉為項目！\n項目 ID：${newProjectId}\n開始日期：${idea.start_date || '未填'}\n完成日期：${idea.target_date || '未填'}`);
    loadApprovedIdeas();
};

            loadApprovedIdeas();

            // Sidebar 控制
            const sidebar = document.getElementById('sidebarFrame');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.getElementById('toggleSidebar');
            let isCollapsed = localStorage.getItem('sidebarCollapsed') !== 'false';

            function updateSidebar() {
                const w = isCollapsed ? '54px' : '260px';
                const m = isCollapsed ? '54px' : '260px';
                sidebar.style.width = w;
                mainContent.style.marginLeft = m;
            }

            toggleBtn.addEventListener('click', () => {
                isCollapsed = !isCollapsed;
                localStorage.setItem('sidebarCollapsed', isCollapsed);
                updateSidebar();
            });

            sidebar.addEventListener('load', () => setTimeout(updateSidebar, 150));
            updateSidebar();
        });
    </script>
</body>
</html>
