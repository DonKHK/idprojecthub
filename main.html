<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的項目 | I&D Project Hub v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF' } } } }
    </script>
    <style>
        body { background: #f8fafc; margin: 0; }
        .sidebar-iframe { width: 54px; height: 100vh; border: none; position: fixed; transition: all 0.4s ease; z-index: 50; }
        .main-content { margin-left: 54px; transition: all 0.4s ease; }
        .proj-card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            transition: all 0.3s; 
        }
        .proj-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 40px rgba(22,93,255,0.15); 
        }
        .health-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>

    <div class="main-content min-h-screen">
        <header class="bg-white shadow-sm px-8 py-3 sticky top-0 z-40">
            <div class="flex flex-col lg:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <button id="toggleSidebar" class="text-3xl p-2 hover:bg-slate-100 rounded-2xl">
                        <i class="fa fa-bars"></i>
                    </button>
                    <h2 class="text-3xl font-bold text-slate-900">我的項目</h2>
                </div>

                <!-- Filter & Sort -->
                <div class="flex items-center gap-4">
                    <div class="flex bg-white border border-slate-200 rounded-2xl p-1 text-sm">
                        <button onclick="filterStatus('all')" id="filter-all" class="px-5 py-2 rounded-[14px] font-medium active">全部</button>
                        <button onclick="filterStatus('Planning')" id="filter-planning" class="px-5 py-2 rounded-[14px] font-medium">Planning</button>
                        <button onclick="filterStatus('In Progress')" id="filter-progress" class="px-5 py-2 rounded-[14px] font-medium">進行中</button>
                        <button onclick="filterStatus('Completed')" id="filter-completed" class="px-5 py-2 rounded-[14px] font-medium">已完成</button>
                    </div>

                    <select id="sortSelect" onchange="applySortAndFilter()" class="px-4 py-3 border border-slate-300 rounded-2xl focus:border-primary focus:outline-none text-sm">
                        <option value="created-desc">加入日期（最新）</option>
                        <option value="created-asc">加入日期（最舊）</option>
                        <option value="end-asc">結束日期（最早到期）</option>
                        <option value="amount-desc">金額（大 → 小）</option>
                        <option value="amount-asc">金額（小 → 大）</option>
                    </select>

                    <a href="create_project.html" class="bg-primary text-white px-6 py-3 rounded-2xl flex items-center gap-2 hover:bg-primary/90">
                        <i class="fa fa-plus"></i> 新增項目
                    </a>
                </div>
            </div>
        </header>

        <main class="p-8">
            <div id="projContainer" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </main>
    </div>

    <script>
        let projects = [];
        let currentFilter = 'all';
        let currentSort = 'created-desc';

        // 健康度判斷（已加入你要求的規則）
        function getHealth(p) {
            if (!p.endDate) {
                return { color: 'bg-red-500', label: '無結束日期' };
            }
            if (!p.totalAmount || p.totalAmount <= 0) {
                return { color: 'bg-red-500', label: '無預算' };
            }

            const now = new Date();
            const end = new Date(p.endDate);
            const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));

            let label = '';
            let color = 'green';

            if (diffDays < -14) {
                label = `已超期 ${Math.abs(diffDays)} 天`;
                color = 'red';
            } else if (diffDays < 0) {
                label = `已超期 ${Math.abs(diffDays)} 天`;
                color = 'red';
            } else if (diffDays <= 14) {
                label = `剩 ${diffDays} 天`;
                color = 'yellow';
            } else {
                label = '正常';
                color = 'green';
            }

            // 預算檢查
            if (p.usedAmount && p.usedAmount > 0) {
                const ratio = p.usedAmount / p.totalAmount;
                if (ratio > 1.05) {
                    label = label + ' | 預算超支';
                    color = 'red';
                } else if (ratio > 0.95 && color !== 'red') {
                    label = label + ' | 預算接近上限';
                    color = 'yellow';
                }
            }

            return {
                color: color === 'red' ? 'bg-red-500' : color === 'yellow' ? 'bg-amber-500' : 'bg-emerald-500',
                label: label
            };
        }

       function renderProjects(data) {
    const container = document.getElementById('projContainer');
    container.innerHTML = data.map(p => {
        const health = getHealth(p);
        
        return `
        <div class="proj-card p-6">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-3">
                    <div class="${health.color} health-dot"></div>
                    <span class="text-xs font-medium text-slate-600">${health.label}</span>
                </div>
                
                <!-- Project ID -->
                <div class="flex items-center gap-2">
                    <span class="text-xs font-mono bg-slate-100 px-3 py-1 rounded-full text-slate-600">${p.id}</span>
                    <span class="text-sm px-4 py-1 rounded-2xl ${p.status==='Completed'?'bg-emerald-100 text-emerald-700': p.status==='In Progress'?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700'}">
                        ${p.status || 'Planning'}
                    </span>
                </div>
            </div>
            
            <h3 class="font-bold text-xl mb-1">${p.name || '未命名項目'}</h3>
            <p class="text-xs text-slate-500 mb-4">${p.id}</p>   <!-- 額外一行顯示 ID（更醒目） -->
            
            <div class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm text-slate-600 mt-4">
                <div><span class="text-slate-500">持有人：</span>${p.owner || '—'}</div>
                <div><span class="text-slate-500">經理：</span>${p.manager || '—'}</div>
                <div><span class="text-slate-500">開始：</span>${p.startDate || p.start_date || '—'}</div>
                <div><span class="text-slate-500">結束：</span>${p.endDate || p.target_date || '—'}</div>
                <div class="col-span-2"><span class="text-slate-500">總金額：</span><span class="font-semibold">HK$ ${Number(p.totalAmount || 0).toLocaleString()}</span></div>
            </div>
            
            <div class="flex gap-3 mt-6">
                <a href="detail_project.html?id=${p.id}" class="flex-1 bg-primary text-white text-center py-3 rounded-2xl hover:bg-primary/90">查看詳情</a>
                <a href="edit_project.html?id=${p.id}" class="flex-1 border border-slate-300 text-center py-3 rounded-2xl hover:bg-slate-50">編輯</a>
            </div>
        </div>`;
    }).join('');
}

        function filterStatus(status) {
            currentFilter = status;
            document.querySelectorAll('#filter-all, #filter-planning, #filter-progress, #filter-completed').forEach(btn => {
                btn.classList.toggle('active', btn.id === `filter-${status === 'all' ? 'all' : status.toLowerCase()}`);
            });
            applySortAndFilter();
        }

        function applySortAndFilter() {
            currentSort = document.getElementById('sortSelect').value;
            let filtered = projects;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.status === currentFilter);
            }

            filtered.sort((a, b) => {
                if (currentSort === 'created-desc') return (b.createdDate || '') > (a.createdDate || '') ? 1 : -1;
                if (currentSort === 'created-asc') return (a.createdDate || '') > (b.createdDate || '') ? 1 : -1;
                if (currentSort === 'end-asc') return (a.endDate || '') > (b.endDate || '') ? 1 : -1;
                if (currentSort === 'amount-desc') return (b.totalAmount || 0) - (a.totalAmount || 0);
                if (currentSort === 'amount-asc') return (a.totalAmount || 0) - (b.totalAmount || 0);
                return 0;
            });

            renderProjects(filtered);
        }

        document.addEventListener('DOMContentLoaded', function() {
            projects = JSON.parse(localStorage.getItem('pmis_projects')) || [];
            renderProjects(projects);

// === 只對訪客禁用 ===
if (localStorage.getItem('accessLevel') === 'admin') {
	// 禁用「新增項目」按鈕
    const addBtn = document.querySelector('a[href="create_project.html"]');
    if (addBtn) {
        addBtn.classList.add('opacity-50', 'cursor-not-allowed', '!bg-slate-300', '!text-slate-500');
        addBtn.href = '#';
        addBtn.onclick = () => alert('無法新增項目');
    }

	// 禁用所有「編輯」按鈕
   	document.querySelectorAll('a[href^="edit_project.html"]').forEach(btn => {
        btn.classList.add('!bg-slate-300', '!text-slate-500', '!cursor-not-allowed', 'opacity-50');
        btn.href = '#';
        btn.onclick = () => alert('無法編輯項目');
    });
}

            // Sidebar 控制
            const sidebar = document.getElementById('sidebarFrame');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.getElementById('toggleSidebar');
            let isCollapsed = localStorage.getItem('sidebarCollapsed') !== 'false';

            function updateSidebar() {
                const w = isCollapsed ? '54px' : '260px';
                const m = isCollapsed ? '54px' : '260px';
                sidebar.style.width = w;
                mainContent.style.marginLeft = m;
            }

            toggleBtn.addEventListener('click', () => {
                isCollapsed = !isCollapsed;
                localStorage.setItem('sidebarCollapsed', isCollapsed);
                updateSidebar();
            });

            sidebar.addEventListener('load', () => setTimeout(updateSidebar, 150));
            updateSidebar();
        });
    </script>
</body>
</html>
