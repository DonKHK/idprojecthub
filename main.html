<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的項目 | PMIS_Don V2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F',
                        dark: '#0F172A',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        card: '0 10px 40px rgba(0, 0, 0, 0.08)',
                        cardHover: '0 20px 65px rgba(22, 93, 255, 0.13)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-gradient {
                background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            }
            .dashboard-bg {
                background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%);
            }
            .glass {
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(12px);
            }
            .badge-glow {
                box-shadow: 0 0 12px rgba(22, 93, 255, 0.15);
            }
        }
    </style>
    <style>
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
        .sidebar-iframe { 
            width: 44px; 
            height: 100vh; 
            border: none; 
            position: fixed; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 10;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.06);
        }
        .main-content { 
            margin-left: 44px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        /* 高級 Dashboard 項目卡片 */
        .proj-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.07);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.8);
            overflow: hidden;
        }
        .proj-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 22px 65px rgba(22, 93, 255, 0.13);
        }
        .info-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
            width: 110px;
            flex-shrink: 0;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }
        /* 階段明細列 */
        .phase-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(226, 232, 240, 0.5);
        }
        .phase-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="dashboard-bg">
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>

    <div class="main-content min-h-screen">
        <!-- 毛玻璃頂部導航 -->
        <header class="glass sticky top-0 z-20 px-6 py-5 shadow-sm">
            <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-5">
                <div class="flex items-center gap-4">
                    <button id="toggleSidebar" class="text-gray-600 hover:text-primary text-2xl p-2.5 rounded-xl hover:bg-primary/5 transition-all">
                        <i class="fa fa-bars"></i>
                    </button>
                    <h2 class="text-2xl font-bold text-dark tracking-tight">我的項目</h2>
                </div>

                <!-- 高級搜索 + 新增 -->
                <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="搜尋項目 ID / 名稱 / 負責人..." 
                        class="px-4 py-3 rounded-xl border border-gray-200 w-full sm:w-72 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all">
                    <a href="create_project.html" class="bg-primary text-white px-6 py-3 rounded-xl text-sm font-medium hover:bg-primary/90 transition flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
                        <i class="fa fa-plus"></i> 新增項目
                    </a>
                </div>
            </div>
        </header>

        <main class="p-6 pb-12">
            <!-- 項目卡片網格 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8" id="projContainer"></div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const projects = JSON.parse(localStorage.getItem('pmis_projects')) || [];
            const container = document.getElementById('projContainer');
            const searchInput = document.getElementById('searchInput');

            // ============== 核心：日期狀態判斷（14日即將到期） ==============
            function getDateStatus(endDate) {
                if (!endDate) return 'normal';
                const today = new Date();
                const end = new Date(endDate);
                const diffDays = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
                
                if (diffDays >= 14) return 'normal';
                if (diffDays >= 0) return 'warning';
                return 'expired';
            }

            // ============== 渲染所有階段明細 ==============
            function renderPhaseList(phases = []) {
                if (phases.length === 0) {
                    return `<div class="text-gray-400 text-sm italic">暫無階段</div>`;
                }

                return phases.map(phase => {
                    // 階段名稱
                    const phaseName = phase.type || '未命名階段';
                    // 階段狀態
                    const phaseStatus = phase.status || 'Planning';
                    // 日期狀態（只有進行中先顯示）
                    let dateBadge = '';
                    if (phaseStatus === 'In Progress') {
                        const dateStatus = getDateStatus(phase.endDate);
                        if (dateStatus === 'normal') {
                            dateBadge = `<span class="status-badge bg-success/10 text-success">正常</span>`;
                        } else if (dateStatus === 'warning') {
                            dateBadge = `<span class="status-badge bg-warning/10 text-warning">即將到期</span>`;
                        } else {
                            dateBadge = `<span class="status-badge bg-danger/10 text-danger">過期</span>`;
                        }
                    }

                    // 階段狀態標籤
                    let statusBadge = '';
                    if (phaseStatus === 'Completed') {
                        statusBadge = `<span class="status-badge bg-success/10 text-success">已完成</span>`;
                    } else if (phaseStatus === 'In Progress') {
                        statusBadge = `<span class="status-badge bg-primary/10 text-primary">進行中</span>`;
                    } else {
                        statusBadge = `<span class="status-badge bg-gray-100 text-gray-600">規劃中</span>`;
                    }

                    return `
                    <div class="phase-row">
                        <div class="text-sm font-medium text-gray-800">${phaseName}</div>
                        <div class="flex items-center gap-2">
                            ${statusBadge}
                            ${dateBadge}
                        </div>
                    </div>
                    `;
                }).join('');
            }

            // ============== 渲染高級項目卡片 ==============
            function renderProjects(filtered = projects) {
                if(filtered.length === 0){
                    container.innerHTML = `
                        <div class="col-span-full text-center py-24">
                            <i class="fa fa-folder-open text-6xl text-gray-300 mb-5"></i>
                            <p class="text-xl text-gray-400">暫無項目</p>
                            <a href="create_project.html" class="inline-block mt-7 bg-primary text-white px-7 py-3.5 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 transition">
                                建立第一個項目
                            </a>
                        </div>`;
                    return;
                }

                container.innerHTML = filtered.map(p => {
                    return `
                    <div class="proj-card p-7">
                        <!-- 卡片頂部 -->
                        <div class="flex justify-between items-center mb-5 pb-4 border-b border-gray-100">
                            <h3 class="text-xl font-bold text-dark truncate">${p.name || '未命名項目'}</h3>
                            <span class="status-badge bg-primary/10 text-primary">${p.id || '—'}</span>
                        </div>

                        <!-- 基本資訊 -->
                        <div class="space-y-1 mb-6">
                            <div class="info-row">
                                <span class="info-label">項目描述</span>
                                <span class="text-gray-700 line-clamp-2">${p.description || '—'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">項目經理</span>
                                <span class="text-dark">${p.manager || '—'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">負責人</span>
                                <span class="text-dark">${p.owner || '—'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">技術支援</span>
                                <span class="text-dark">${p.support || '—'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">總金額</span>
                                <span class="text-dark font-bold">HK$ ${Number(p.totalAmount || 0).toLocaleString()}</span>
                            </div>
                        </div>

                        <!-- ========== 階段明細清單（重點） ========== -->
                        <div class="mb-6">
                            <div class="text-sm font-semibold text-gray-600 mb-3">階段狀態 & 進度</div>
                            <div class="space-y-1">
                                ${renderPhaseList(p.phases)}
                            </div>
                        </div>

                        <!-- 操作按鈕 -->
                        <div class="flex gap-4">
                            <a href="detail_project.html?id=${p.id}" 
                               class="flex-1 text-center bg-primary text-white py-3 rounded-xl hover:bg-primary/90 transition shadow-lg shadow-primary/20">
                                查看詳情
                            </a>
                            <a href="edit_project.html?id=${p.id}" 
                               class="flex-1 text-center bg-gray-100 text-gray-700 py-3 rounded-xl hover:bg-gray-200 transition">
                                編輯項目
                            </a>
                        </div>
                    </div>
                    `;
                }).join('');
            }

            renderProjects();

            // 實時搜尋
            searchInput.addEventListener('input', e => {
                const kw = e.target.value.toLowerCase();
                const data = projects.filter(i => 
                    (i.id||'').toLowerCase().includes(kw) ||
                    (i.name||'').toLowerCase().includes(kw) ||
                    (i.owner||'').toLowerCase().includes(kw) ||
                    (i.manager||'').toLowerCase().includes(kw)
                );
                renderProjects(data);
            });

            // 側邊欄控制
            let collapse = localStorage.getItem('sidebarCollapsed') !== 'false';
            const side = document.getElementById('sidebarFrame');
            const main = document.querySelector('.main-content');
            const btn = document.getElementById('toggleSidebar');

            function update() {
                const w = collapse ? '44px' : '260px';
                const m = collapse ? '44px' : '260px';
                side.style.width = w;
                main.style.marginLeft = m;
            }

            btn.addEventListener('click', () => {
                collapse = !collapse;
                localStorage.setItem('sidebarCollapsed', collapse);
                update();
            });

            side.addEventListener('load', () => setTimeout(update, 100));
            update();
        });
    </script>
</body>
</html>
