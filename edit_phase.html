<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯階段 | I&D Project Hub v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF' } } } }
    </script>
    <style>
        body { background: #f8fafc; margin: 0; }
        .sidebar-iframe { width: 54px; height: 100vh; border: none; position: fixed; transition: all 0.4s ease; z-index: 50; }
        .main-content { margin-left: 54px; transition: all 0.4s ease; }
        .card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .health-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>

    <div class="main-content min-h-screen">
        <header class="bg-white shadow-sm px-8 py-3 sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button id="toggleSidebar" class="text-3xl p-2 hover:bg-slate-100 rounded-2xl">
                    <i class="fa fa-bars"></i>
                </button>
                <h2 class="text-3xl font-bold text-slate-900">編輯階段</h2>
            </div>
        </header>

        <main class="p-8 max-w-2xl mx-auto">
            <div class="card p-8">
                <form id="editPhaseForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">階段類型 *</label>
                        <select name="type" required class="w-full border border-slate-300 rounded-2xl p-4 focus:border-primary focus:outline-none">
                            <option value="Idea / R&D">Idea / R&D</option>
                            <option value="Feasibility Study">Feasibility Study</option>
                            <option value="POC">POC</option>
                            <option value="Demo">Demo</option>
                            <option value="Pilot / UAT">Pilot / UAT</option>
                            <option value="Commercialization">Commercialization</option>
                            <option value="Mass Production">Mass Production</option>
                            <option value="Wrap up & Handover">Wrap up & Handover</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">開始日期</label>
                            <input name="startDate" type="date" class="w-full border border-slate-300 rounded-2xl p-4">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">結束日期</label>
                            <input name="endDate" type="date" id="endDateInput" class="w-full border border-slate-300 rounded-2xl p-4" onchange="previewHealth()">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-2">預算 (HKD)</label>
                            <input name="budget" type="number" class="w-full border border-slate-300 rounded-2xl p-4">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">已使用金額 (HKD)</label>
                            <input name="usedAmount" type="number" class="w-full border border-slate-300 rounded-2xl p-4">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">階段狀態</label>
                            <select name="status" id="statusSelect" class="w-full border border-slate-300 rounded-2xl p-4" onchange="previewHealth()">
                                <option value="Planning">Planning</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <!-- 健康度即時預覽 -->
                    <div id="healthPreview" class="hidden p-5 bg-slate-50 border border-slate-200 rounded-2xl flex items-center gap-4">
                        <div id="previewDot" class="health-dot"></div>
                        <span id="previewLabel" class="font-semibold text-slate-700 text-lg"></span>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2">主要描述</label>
                        <textarea name="description" rows="4" class="w-full border border-slate-300 rounded-3xl p-4"></textarea>
                    </div>

                    <div class="flex justify-end gap-4 pt-4">
                        <a id="cancelBtn" class="px-8 py-4 border border-slate-300 rounded-2xl hover:bg-slate-100">取消</a>
                        <button type="submit" class="px-8 py-4 bg-primary text-white rounded-2xl hover:bg-primary/90">更新階段</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // 即時健康度預覽（紅黃綠 + 原因）
        function previewHealth() {
            const endDate = document.getElementById('endDateInput').value;
            const status = document.getElementById('statusSelect').value;
            const preview = document.getElementById('healthPreview');
            const dot = document.getElementById('previewDot');
            const label = document.getElementById('previewLabel');

            if (status === 'Completed') {
                dot.className = 'health-dot bg-emerald-500';
                label.innerHTML = '✅ 已完成';
                preview.classList.remove('hidden');
                return;
            }

            if (!endDate) {
                preview.classList.add('hidden');
                return;
            }

            const now = new Date();
            const end = new Date(endDate);
            const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));

            let colorClass = 'bg-emerald-500';
            let reason = '正常';

            if (diffDays < -14) {
                colorClass = 'bg-red-500';
                reason = `❌ 已超期 ${Math.abs(diffDays)} 天`;
            } else if (diffDays < 0) {
                colorClass = 'bg-red-500';
                reason = `❌ 已超期 ${Math.abs(diffDays)} 天`;
            } else if (diffDays <= 14) {
                colorClass = 'bg-amber-500';
                reason = `⚠️ 剩 ${diffDays} 天`;
            }

            dot.className = `health-dot ${colorClass}`;
            label.innerHTML = reason;
            preview.classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('projectId');
            const phaseId = params.get('phaseId');

            let projects = JSON.parse(localStorage.getItem('pmis_projects')) || [];
            let project = projects.find(p => p.id === projectId);
            if (!project || !project.phases) {
                alert('找不到項目');
                history.back();
                return;
            }

            let phase = project.phases.find(ph => String(ph.id) === String(phaseId));
            if (!phase) {
                alert('找不到該階段');
                history.back();
                return;
            }

            // 填入原有資料
            document.querySelector('[name="type"]').value = phase.type || 'Others';
            document.querySelector('[name="startDate"]').value = phase.startDate || '';
            document.querySelector('[name="endDate"]').value = phase.endDate || '';
            document.querySelector('[name="budget"]').value = phase.budget || 0;
            document.querySelector('[name="usedAmount"]').value = phase.usedAmount || 0;
            document.querySelector('[name="status"]').value = phase.status || 'Planning';
            document.querySelector('[name="description"]').value = phase.description || '';

            document.getElementById('cancelBtn').href = `detail_project.html?id=${projectId}`;

            // 提交更新
            document.getElementById('editPhaseForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const fd = new FormData(this);

                phase.type = fd.get('type');
                phase.startDate = fd.get('startDate');
                phase.endDate = fd.get('endDate');
                phase.budget = Number(fd.get('budget') || 0);
                phase.usedAmount = Number(fd.get('usedAmount') || 0);
                phase.status = fd.get('status');
                phase.description = fd.get('description');

                localStorage.setItem('pmis_projects', JSON.stringify(projects));
                alert('✅ 階段更新成功！');
                location.href = `detail_project.html?id=${projectId}`;
            });

            // Sidebar 控制
            const sidebar = document.getElementById('sidebarFrame');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.getElementById('toggleSidebar');
            let isCollapsed = localStorage.getItem('sidebarCollapsed') !== 'false';

            function updateSidebar() {
                const w = isCollapsed ? '54px' : '260px';
                const m = isCollapsed ? '54px' : '260px';
                sidebar.style.width = w;
                mainContent.style.marginLeft = m;
            }

            toggleBtn.addEventListener('click', () => {
                isCollapsed = !isCollapsed;
                localStorage.setItem('sidebarCollapsed', isCollapsed);
                updateSidebar();
            });

            sidebar.addEventListener('load', () => setTimeout(updateSidebar, 150));
            updateSidebar();
        });
    </script>
</body>
</html>
