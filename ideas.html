<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交 Idea | I&D Project Hub v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF' } } } }
    </script>
    <style>
        body { background: #f8fafc; margin: 0; }
        .sidebar-iframe { width: 54px; height: 100vh; border: none; position: fixed; transition: all 0.4s ease; z-index: 50; }
        .main-content { margin-left: 54px; transition: all 0.4s ease; }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>

    <div class="main-content min-h-screen">
        <header class="bg-white shadow-sm px-8 py-3 sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button id="toggleSidebar" class="text-3xl p-2 hover:bg-slate-100 rounded-2xl">
                    <i class="fa fa-bars"></i>
                </button>
                <h2 class="text-3xl font-bold text-slate-900">提交 Idea</h2>
            </div>
        </header>

        <main class="p-8 max-w-5xl mx-auto">
            <!-- 步驟指示器 -->
            <div class="bg-white rounded-3xl shadow p-6 mb-8">
                <div class="flex justify-between items-center">
                    <div onclick="goToStep(1)" class="step-indicator flex-1 flex flex-col items-center cursor-pointer" data-step="1">
                        <div id="step1-dot" class="w-10 h-10 rounded-2xl bg-primary text-white flex items-center justify-center font-bold">1</div>
                        <span class="text-xs mt-2">申請人資料</span>
                    </div>
                    <div class="flex-1 h-px bg-slate-200 self-center mx-2"></div>
                    <div onclick="goToStep(2)" class="step-indicator flex-1 flex flex-col items-center cursor-pointer" data-step="2">
                        <div id="step2-dot" class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-400 flex items-center justify-center font-bold">2</div>
                        <span class="text-xs mt-2">項目基本資訊</span>
                    </div>
                    <div class="flex-1 h-px bg-slate-200 self-center mx-2"></div>
                    <div onclick="goToStep(3)" class="step-indicator flex-1 flex flex-col items-center cursor-pointer" data-step="3">
                        <div id="step3-dot" class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-400 flex items-center justify-center font-bold">3</div>
                        <span class="text-xs mt-2">項目範圍與詳情</span>
                    </div>
                    <div class="flex-1 h-px bg-slate-200 self-center mx-2"></div>
                    <div onclick="goToStep(4)" class="step-indicator flex-1 flex flex-col items-center cursor-pointer" data-step="4">
                        <div id="step4-dot" class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-400 flex items-center justify-center font-bold">4</div>
                        <span class="text-xs mt-2">預算詳情</span>
                    </div>
                    <div class="flex-1 h-px bg-slate-200 self-center mx-2"></div>
                    <div onclick="goToStep(5)" class="step-indicator flex-1 flex flex-col items-center cursor-pointer" data-step="5">
                        <div id="step5-dot" class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-400 flex items-center justify-center font-bold">5</div>
                        <span class="text-xs mt-2">技術與創新</span>
                    </div>
                    <div class="flex-1 h-px bg-slate-200 self-center mx-2"></div>
                    <div onclick="goToStep(6)" class="step-indicator flex-1 flex flex-col items-center cursor-pointer" data-step="6">
                        <div id="step6-dot" class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-400 flex items-center justify-center font-bold">6</div>
                        <span class="text-xs mt-2">其他補充</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow p-8">
                <form id="projectForm" class="space-y-8">

                    <!-- Step 1 -->
                    <div class="step-content active" id="step1">
                        <h3 class="text-xl font-semibold mb-6">1. 申請人及聯絡人資料</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label class="block text-sm font-medium mb-2">申請人姓名</label><input name="applicantName" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                            <div><label class="block text-sm font-medium mb-2">所屬部門及團隊</label><input name="department" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                        </div>
                        <div class="mt-8">
                            <h4 class="font-medium mb-3">First Contact Person (PM)</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div><label class="block text-sm font-medium mb-2">姓名</label><input name="pmName" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">聯絡電話</label><input name="pmPhone" type="tel" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">Email</label><input name="pmEmail" type="email" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">部門</label><input name="pmDepartment" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                            </div>
                        </div>
                        <div class="mt-8">
                            <h4 class="font-medium mb-3">Second Contact Person</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div><label class="block text-sm font-medium mb-2">姓名</label><input name="scName" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">聯絡電話</label><input name="scPhone" type="tel" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">Email</label><input name="scEmail" type="email" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">部門</label><input name="scDepartment" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                            </div>
                        </div>
                        <div class="mt-8">
                            <h4 class="font-medium mb-3">Project Owner</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div><label class="block text-sm font-medium mb-2">姓名</label><input name="ownerName" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">聯絡電話</label><input name="ownerPhone" type="tel" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">Email</label><input name="ownerEmail" type="email" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                                <div><label class="block text-sm font-medium mb-2">部門/公司</label><input name="ownerDepartment" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2 -->
                    <div class="step-content" id="step2">
                        <h3 class="text-xl font-semibold mb-6">2. 項目基本資訊</h3>
                        <div><label class="block text-sm font-medium mb-2">Project / Idea Title</label><input name="projectTitle" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">Project Type</label>
                            <select name="projectType" class="w-full border border-slate-300 rounded-2xl p-4">
                                <option value="">請選擇</option>
                                <option value="ai">AI 人工智能應用</option>
                                <option value="iot">IoT 物聯網系統</option>
                                <option value="automation">流程自動化</option>
                                <option value="app">流動應用程式</option>
                                <option value="web">網頁系統</option>
                                <option value="hardware">硬件/設備開發</option>
                                <option value="drone">無人機應用</option>
                                <option value="robotics">機械人/自動化設備</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">項目背景及目標</label><textarea name="projectBackground" rows="4" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">痛點描述</label><textarea name="painPoints" rows="4" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">現有臨時處理方法</label><textarea name="currentWorkarounds" rows="3" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                    </div>

                    <!-- Step 3 -->
                    <div class="step-content" id="step3">
                        <h3 class="text-xl font-semibold mb-6">3. 項目範圍與詳情</h3>
                        <div><label class="block text-sm font-medium mb-2">項目範圍</label><textarea name="projectScope" rows="5" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">預期交付成果</label><textarea name="deliverables" rows="4" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">預期效益</label><textarea name="benefits" rows="4" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">潛在風險及實施困難</label><textarea name="risks" rows="3" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">預計完成時間(月)</label><input name="duration" type="number" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                    </div>

                    <!-- Step 4 -->
                    <div class="step-content" id="step4">
                        <h3 class="text-xl font-semibold mb-6">4. 項目預算詳情</h3>
                        <div><label class="block text-sm font-medium mb-2">總預算估算 (HKD)</label><input name="totalBudget" type="number" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">預算細分</label><textarea name="budgetBreakdown" rows="4" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">預算來源</label><input name="budgetSource" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">目標政府資助</label><input name="govFund" class="w-full border border-slate-300 rounded-2xl p-4"></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">目標資金詳情</label><textarea name="fundDetails" rows="3" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                    </div>

                    <!-- Step 5 -->
                    <div class="step-content" id="step5">
                        <h3 class="text-xl font-semibold mb-6">5. 技術與創新</h3>
                        <div><label class="block text-sm font-medium mb-2">建議技術方向</label><textarea name="techDirection" rows="3" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">項目創新亮點</label><textarea name="innovation" rows="3" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">具體技術需求</label><textarea name="techRequirements" rows="4" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">是否需要申請專利</label>
                            <select name="requireIP" class="w-full border border-slate-300 rounded-2xl p-4">
                                <option value="">請選擇</option>
                                <option value="yes">是</option>
                                <option value="no">否</option>
                                <option value="undecided">待定</option>
                            </select>
                        </div>
                    </div>

                    <!-- Step 6 -->
                    <div class="step-content" id="step6">
                        <h3 class="text-xl font-semibold mb-6">6. 其他補充資料</h3>
                        <div><label class="block text-sm font-medium mb-2">Project Termination Factor</label><textarea name="terminationFactor" rows="3" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                        <div class="mt-6"><label class="block text-sm font-medium mb-2">其他補充備註</label><textarea name="comments" rows="5" class="w-full border border-slate-300 rounded-3xl p-4"></textarea></div>
                    </div>

                    <!-- 按鈕 -->
                    <div class="flex justify-between pt-8 border-t">
                        <button type="button" id="prevBtn" onclick="prevStep()" class="px-8 py-4 border border-slate-300 rounded-2xl hover:bg-slate-100 hidden">上一步</button>
                        <div class="flex gap-3">
                            <button type="button" onclick="resetForm()" class="px-8 py-4 border border-slate-300 rounded-2xl hover:bg-slate-100">重置</button>
                            <button type="button" id="nextBtn" onclick="nextStep()" class="px-8 py-4 bg-primary text-white rounded-2xl hover:bg-primary/90">下一步</button>
                            <button type="submit" id="submitBtn" class="px-8 py-4 bg-emerald-600 text-white rounded-2xl hover:bg-emerald-700 hidden">提交申請</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 6;

        function showStep(step) {
            document.querySelectorAll('.step-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`step${step}`).classList.add('active');
            currentStep = step;
            document.getElementById('prevBtn').classList.toggle('hidden', step === 1);
            document.getElementById('nextBtn').classList.toggle('hidden', step === totalSteps);
            document.getElementById('submitBtn').classList.toggle('hidden', step !== totalSteps);
        }

        function nextStep() { if (currentStep < totalSteps) showStep(currentStep + 1); }
        function prevStep() { if (currentStep > 1) showStep(currentStep - 1); }

        function resetForm() {
            document.getElementById('projectForm').reset();
            showStep(1);
        }

        // 提交表單
        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            const now = new Date();

            const idea = {
                id: 'IDEA-' + Date.now().toString().slice(-6),
                submitDate: now.toISOString().slice(0, 10),
                submitTime: now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false }),
                status: 'pending',
                applicantName: fd.get('applicantName'),
                department: fd.get('department'),
                pmName: fd.get('pmName'),
                pmPhone: fd.get('pmPhone'),
                pmEmail: fd.get('pmEmail'),
                scName: fd.get('scName'),
                ownerName: fd.get('ownerName'),
                projectTitle: fd.get('projectTitle'),
                projectType: fd.get('projectType'),
                projectBackground: fd.get('projectBackground'),
                painPoints: fd.get('painPoints'),
                currentWorkarounds: fd.get('currentWorkarounds'),
                projectScope: fd.get('projectScope'),
                deliverables: fd.get('deliverables'),
                benefits: fd.get('benefits'),
                risks: fd.get('risks'),
                duration: fd.get('duration'),
                totalBudget: fd.get('totalBudget'),
                budgetBreakdown: fd.get('budgetBreakdown'),
                govFund: fd.get('govFund'),
                techDirection: fd.get('techDirection'),
                innovation: fd.get('innovation'),
                terminationFactor: fd.get('terminationFactor'),
                comments: fd.get('comments')
            };

            let ideas = JSON.parse(localStorage.getItem('pmis_ideas')) || [];
            ideas.push(idea);
            localStorage.setItem('pmis_ideas', JSON.stringify(ideas));

            const filename = `project_idea_${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}${now.getSeconds().toString().padStart(2,'0')}.json`;
            const blob = new Blob([JSON.stringify(ideas, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);

            alert(`✅ Idea 申請已成功提交！\n\n已儲存為：${filename}`);
            this.reset();
            showStep(1);
        });

        // Sidebar 控制
        const sidebar = document.getElementById('sidebarFrame');
        const mainContent = document.querySelector('.main-content');
        const toggleBtn = document.getElementById('toggleSidebar');
        let isCollapsed = localStorage.getItem('sidebarCollapsed') !== 'false';

        function updateSidebar() {
            const w = isCollapsed ? '54px' : '260px';
            const m = isCollapsed ? '54px' : '260px';
            sidebar.style.width = w;
            mainContent.style.marginLeft = m;
        }

        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            localStorage.setItem('sidebarCollapsed', isCollapsed);
            updateSidebar();
        });

        sidebar.addEventListener('load', () => setTimeout(updateSidebar, 150));
        updateSidebar();

        // 初始化
        showStep(1);
    </script>
</body>
</html>
