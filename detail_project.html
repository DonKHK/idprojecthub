<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>項目詳情 | PMIS_Don V2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .status-badge { @apply px-2 py-1 rounded-full text-xs font-medium; }
            .phase-normal { @apply bg-success/10 text-success; }
            .phase-warning { @apply bg-warning/10 text-warning; }
            .phase-expired { @apply bg-danger/10 text-danger; }
        }
        body { background-color: #F8FAFC; margin: 0; }
        .sidebar-iframe { width: 260px; height: 100vh; border: none; position: fixed; transition: all 0.3s ease; }
        .main-content { margin-left: 260px; transition: all 0.3s ease; }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe"></iframe>

    <div class="main-content">
        <header class="bg-white shadow-sm px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <button id="toggleSidebar" class="mr-4 text-gray-500 hover:text-gray-800 text-lg p-1 rounded hover:bg-gray-100">
                        <i class="fa fa-bars"></i>
                    </button>
                    <h2 class="text-gray-800 font-semibold">項目詳情</h2>
                </div>
                <div class="space-x-2">
                    <a id="editProjectLink" class="bg-gray-600 text-white px-3 py-1 rounded text-sm">
                        編輯項目
                    </a>
                    <a id="addPhaseBtn" class="bg-primary text-white px-3 py-1 rounded text-sm">
                        新增階段
                    </a>
                </div>
            </div>
        </header>

        <main class="p-6">
            <div class="max-w-5xl mx-auto">
                <!-- 項目基本資訊 -->
                <div class="bg-white rounded-xl shadow p-6 mb-6">
                    <div class="text-2xl font-bold text-primary mb-4" id="projectTitle"></div>
                    <div class="grid md:grid-cols-2 gap-4 text-sm">
                        <div><span class="text-gray-500">描述：</span><span id="projectDesc"></span></div>
                        <div><span class="text-gray-500">狀態：</span><span id="projectStatus"></span></div>
                        <div><span class="text-gray-500">項目經理：</span><span id="projectManager"></span></div>
                        <div><span class="text-gray-500">項目負責人：</span><span id="projectOwner"></span></div>
                        <div><span class="text-gray-500">技術支援：</span><span id="projectSupport"></span></div>
                        <div><span class="text-gray-500">總金額：</span><span id="projectAmount"></span></div>
                        <div><span class="text-gray-500">日期：</span><span id="projectDate"></span></div>
                    </div>
                    <div class="mt-4">
                        <span class="text-gray-500 block mb-1">詳細內容：</span>
                        <p class="whitespace-pre-line bg-gray-50 p-3 rounded" id="projectDetail"></p>
                    </div>
                </div>

                <!-- 階段列表 -->
                <div class="bg-white rounded-xl shadow p-6">
                    <h3 class="font-semibold mb-4">項目階段</h3>
                    <div id="phaseList" class="space-y-2">
                        <p class="text-gray-500 text-center py-4">暫無階段</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function getProjects(){return JSON.parse(localStorage.getItem('pmis_projects'))||[];}
            function saveProjects(arr){localStorage.setItem('pmis_projects',JSON.stringify(arr));}

            function getDateStatus(endDate) {
                if (!endDate) return 'normal';
                const today = new Date();
                const end = new Date(endDate);
                const diffTime = end - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays >= 3) return 'normal';
                if (diffDays >= 0) return 'warning';
                return 'expired';
            }

            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            const projects = getProjects();
            const project = projects.find(p => p.id === projectId);

            if (!project) {
                alert('項目不存在');
                location.href = 'main.html';
                return;
            }

            // 填充項目資訊
            document.getElementById('projectTitle').textContent = `${project.id} - ${project.name}`;
            document.getElementById('editProjectLink').href = `edit_project.html?id=${projectId}`;
            document.getElementById('addPhaseBtn').href = `create_phase.html?id=${projectId}`;
            document.getElementById('projectDesc').textContent = project.description || '無';
            document.getElementById('projectStatus').innerHTML = `<span class="status-badge ${
                project.status==='Completed'?'bg-success/10 text-success':
                project.status==='In Progress'?'bg-primary/10 text-primary':'bg-gray-100 text-gray-600'
            }">${project.status}</span>`;
            document.getElementById('projectManager').textContent = project.manager || '未設定';
            document.getElementById('projectOwner').textContent = project.owner || '未設定';
            document.getElementById('projectSupport').textContent = project.support || '未設定';
            document.getElementById('projectAmount').textContent = `HK$ ${Number(project.totalAmount||0).toLocaleString()}`;
            document.getElementById('projectDate').textContent = `${project.startDate||'未設定'} ~ ${project.endDate||'未設定'}`;
            document.getElementById('projectDetail').textContent = project.detail || '無詳細內容';

            // 渲染階段列表
            function renderPhases() {
                const container = document.getElementById('phaseList');
                if (!project.phases || project.phases.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-4">暫無階段</p>';
                    return;
                }

                container.innerHTML = project.phases.map((phase, index) => {
                    const dateStatus = getDateStatus(phase.endDate);
                    const statusClass = dateStatus === 'normal' ? 'phase-normal' : 
                                       dateStatus === 'warning' ? 'phase-warning' : 'phase-expired';
                    const statusText = dateStatus === 'normal' ? '正常' : 
                                      dateStatus === 'warning' ? '即將到期' : '已過期';

                    return `
                    <div class="border rounded p-3 flex flex-col md:flex-row md:items-center justify-between gap-2">
                        <div class="flex-1">
                            <div class="font-medium">${phase.type}</div>
                            <div class="text-xs text-gray-500">
                                ${phase.manager||'未設定'} | ${phase.startDate||'未設定'} ~ ${phase.endDate||'未設定'}
                            </div>
                            <div class="text-xs mt-1">預算: HK$ ${Number(phase.budget||0).toLocaleString()}</div>
                            ${phase.description ? `<div class="text-xs mt-1 text-gray-600">${phase.description}</div>` : ''}
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <span class="status-badge ${
                                phase.status==='Completed'?'bg-success/10 text-success':
                                phase.status==='In Progress'?'bg-primary/10 text-primary':'bg-gray-100 text-gray-600'
                            }">${phase.status}</span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="movePhase(${index}, -1)" class="p-1 bg-gray-200 rounded"><i class="fa fa-arrow-up"></i></button>
                            <button onclick="movePhase(${index}, 1)" class="p-1 bg-gray-200 rounded"><i class="fa fa-arrow-down"></i></button>
                            <button onclick="deletePhase(${index})" class="p-1 text-danger"><i class="fa fa-trash"></i></button>
                        </div>
                    </div>
                    `;
                }).join('');
            }
            renderPhases();

            // 移動階段
            window.movePhase = function(index, direction) {
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= project.phases.length) return;
                
                [project.phases[index], project.phases[newIndex]] = [project.phases[newIndex], project.phases[index]];
                saveProjects(projects);
                renderPhases();
            }

            // 刪除階段
            window.deletePhase = function(index) {
                if (confirm('確定刪除此階段？')) {
                    project.phases.splice(index, 1);
                    saveProjects(projects);
                    renderPhases();
                }
            }

            // Sidebar 切換
            let isHidden = localStorage.getItem('sidebarHidden') === 'true';
            const sidebarIframe = document.querySelector('.sidebar-iframe');
            const mainContent = document.querySelector('.main-content');
            const toggleBtn = document.getElementById('toggleSidebar');

            function toggleSidebar() {
                isHidden = !isHidden;
                localStorage.setItem('sidebarHidden', isHidden);
                
                if (isHidden) {
                    sidebarIframe.style.width = '0';
                    mainContent.style.marginLeft = '0';
                } else {
                    sidebarIframe.style.width = '260px';
                    mainContent.style.marginLeft = '260px';
                }
            }

            if (isHidden) {
                sidebarIframe.style.width = '0';
                mainContent.style.marginLeft = '0';
            }

            toggleBtn.addEventListener('click', toggleSidebar);
        });
    </script>
</body>
</html>
