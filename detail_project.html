<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>項目詳情 | I&D Project Hub v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#165DFF' } } } }
    </script>
    <style>
        body { background: #f8fafc; margin: 0; }
        .sidebar-iframe { width: 54px; height: 100vh; border: none; position: fixed; transition: all 0.4s ease; z-index: 50; }
        .main-content { margin-left: 54px; transition: all 0.4s ease; }
        .card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 24px; }
        .info-item { display: flex; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .info-item:last-child { border-bottom: none; }
        .info-label { width: 180px; font-weight: 600; color: #64748b; }
        .health-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body>
    <iframe src="sidebar.html" class="sidebar-iframe" id="sidebarFrame"></iframe>

    <div class="main-content min-h-screen">
        <header class="bg-white shadow-sm px-8 py-3 sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button id="toggleSidebar" class="text-3xl p-2 hover:bg-slate-100 rounded-2xl">
                    <i class="fa fa-bars"></i>
                </button>
                <h2 class="text-3xl font-bold text-slate-900">項目詳情</h2>
            </div>
        </header>

        <main class="p-8 max-w-6xl mx-auto pb-12">
            <div class="card mb-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <div id="overallHealthDot" class="health-dot"></div>
                            <span id="overallHealthLabel" class="text-sm font-medium"></span>
                        </div>
                        <h1 id="projectName" class="text-4xl font-bold mt-2">載入中...</h1>
                        <p id="projectId" class="text-slate-500">ID：載入中</p>
                    </div>
                    <div id="projectStatus" class="px-6 py-3 text-sm font-semibold rounded-2xl"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="card lg:col-span-2">
                    <h3 class="text-lg font-bold mb-4">基礎資訊</h3>
                    <div class="info-item"><span class="info-label">項目描述</span><span id="projectDesc">無</span></div>
                    <div class="info-item"><span class="info-label">詳細內容</span><span id="projectDetailContent">無</span></div>
                    <div class="info-item"><span class="info-label">終止因素</span><span id="terminationFactor" class="text-red-600">無</span></div>
                    <div class="info-item">
                        <span class="info-label">來自 Idea</span>
                        <span id="fromIdea" class="text-primary hover:underline cursor-pointer font-medium">無</span>
                    </div>
                </div>

                <div class="card">
                    <h3 class="text-lg font-bold mb-4">政府資助</h3>
                    <div class="info-item"><span class="info-label">已申請 FUNDING</span><span id="appliedFunding">無</span></div>
                    <div class="info-item"><span class="info-label">資助金額</span><span id="fundingSupport">HK$ 0</span></div>
                </div>

                <div class="card">
                    <h3 class="text-lg font-bold mb-4">負責團隊</h3>
                    <div class="info-item"><span class="info-label">項目持有人</span><span id="projectOwner">無</span></div>
                    <div class="info-item"><span class="info-label">項目經理</span><span id="projectManager">無</span></div>
                    <div class="info-item"><span class="info-label">技術支援</span><span id="projectSupport">無</span></div>
                </div>

                <div class="card">
                    <h3 class="text-lg font-bold mb-4">金額 & 時間</h3>
                    <div class="info-item"><span class="info-label">總金額</span><span id="totalAmount" class="font-bold">HK$ 0</span></div>
                    <div class="info-item"><span class="info-label">已使用金額</span><span id="usedAmount" class="font-bold text-blue-600">HK$ 0</span></div>
                    <div class="info-item"><span class="info-label">開始日期</span><span id="startDate">無</span></div>
                    <div class="info-item"><span class="info-label">結束日期</span><span id="endDate">無</span></div>
                </div>

                <div class="card lg:col-span-3">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold">階段狀態</h3>
                        <a href="create_phase.html?id=" id="addPhaseBtn" class="bg-primary text-white px-5 py-2 rounded-xl text-sm hover:bg-primary/90">
                            <i class="fa fa-plus"></i> 新增階段
                        </a>
                    </div>
                    <div id="phaseList" class="space-y-3"></div>
                </div>
            </div>

            <div class="flex flex-wrap gap-4 mt-10">
                <a href="main.html" class="px-6 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200">返回列表</a>
                <a id="editBtn" href="" class="px-6 py-3 bg-primary text-white rounded-xl hover:bg-primary/90">編輯項目</a>
                <button onclick="deleteProject()" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl flex items-center gap-2">
                    <i class="fa fa-trash"></i> 刪除項目
                </button>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            if (!projectId) {
                alert('無效的項目ID');
                location.href = 'main.html';
                return;
            }

            let projects = JSON.parse(localStorage.getItem('pmis_projects')) || [];
            const projectIndex = projects.findIndex(p => p.id === projectId);
            const project = projects[projectIndex];

            if (!project) {
                alert('項目不存在');
                location.href = 'main.html';
                return;
            }

            // 整體健康度
            function getOverallHealth(p) {
                if (!p.endDate) return { color: 'bg-red-500', label: '無結束日期' };
                if (!p.totalAmount || p.totalAmount <= 0) return { color: 'bg-red-500', label: '無預算' };
                const now = new Date();
                const end = new Date(p.endDate);
                const diffDays = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
                if (diffDays < -14) return { color: 'bg-red-500', label: `已超期 ${Math.abs(diffDays)} 天` };
                if (diffDays <= 14) return { color: 'bg-amber-500', label: `剩 ${diffDays} 天` };
                return { color: 'bg-emerald-500', label: '正常' };
            }

            const health = getOverallHealth(project);
            document.getElementById('overallHealthDot').className = `health-dot ${health.color}`;
            document.getElementById('overallHealthLabel').textContent = health.label;

                        // === 填入項目資料（已修正日期對應） ===
            document.getElementById('projectName').textContent = project.name || '未命名項目';
            document.getElementById('projectId').textContent = `ID：${project.id}`;
            document.getElementById('projectDesc').textContent = project.description || '無';
            document.getElementById('projectDetailContent').textContent = project.detail || '無';
            document.getElementById('terminationFactor').textContent = project.projectTerminationFactor || '無';
            document.getElementById('appliedFunding').textContent = project.appliedGovernmentFunding || '無';
            document.getElementById('fundingSupport').textContent = `HK$ ${Number(project.fundingSupportHkd || 0).toLocaleString()}`;
            document.getElementById('projectOwner').textContent = project.owner || '無';
            document.getElementById('projectManager').textContent = project.manager || '無';
            document.getElementById('projectSupport').textContent = project.support || '無';
            document.getElementById('totalAmount').textContent = `HK$ ${Number(project.totalAmount || 0).toLocaleString()}`;
            document.getElementById('usedAmount').textContent = `HK$ ${Number(project.usedAmount || 0).toLocaleString()}`;

            // === 重點修正：日期顯示（支援 Idea 轉 Project） ===
            document.getElementById('startDate').textContent = project.startDate || project.start_date || '未設定';
            document.getElementById('endDate').textContent = project.endDate || project.target_date || project.end_date || '未設定';

            // === 重要修正：來自 Idea 連結 ===
            const fromIdeaEl = document.getElementById('fromIdea');
            if (project.createdFromIdea) {
                fromIdeaEl.innerHTML = `來自 Idea <span class="font-mono underline">${project.createdFromIdea}</span>`;
                fromIdeaEl.onclick = function() {
                    window.location.href = `idea_detail.html?id=${project.createdFromIdea}`;
                };
            } else {
                fromIdeaEl.textContent = '無';
            }

            // 狀態
            const statusEl = document.getElementById('projectStatus');
            const statusMap = {
                'Completed': { text: '已完成', class: 'bg-emerald-100 text-emerald-700' },
                'In Progress': { text: '進行中', class: 'bg-blue-100 text-blue-700' },
                'Planning': { text: '規劃中', class: 'bg-amber-100 text-amber-700' }
            };
            const st = statusMap[project.status] || statusMap['Planning'];
            statusEl.className = `px-6 py-3 text-sm font-semibold rounded-2xl ${st.class}`;
            statusEl.textContent = st.text;


            // 階段列表
            const phaseList = document.getElementById('phaseList');
            if (project.phases && project.phases.length > 0) {
                phaseList.innerHTML = project.phases.map(phase => {
                    const color = (phase.status === 'Completed') ? 'bg-emerald-500' : 
                                  (!phase.endDate || new Date(phase.endDate) < new Date()) ? 'bg-red-500' : 'bg-amber-500';
                    return `
                    <div class="bg-gray-50 p-5 rounded-2xl flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="${color} health-dot"></div>
                            <div>
                                <div class="font-medium">${phase.type}</div>
                                <div class="text-sm text-gray-500">${phase.startDate || '—'} → ${phase.endDate || '—'} | ${phase.status || 'Planning'}</div>
                            </div>
                        </div>
                        <a href="edit_phase.html?projectId=${projectId}&phaseId=${phase.id}" class="px-5 py-2 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 text-sm">
                            <i class="fa fa-pencil"></i> 編輯
                        </a>
                    </div>`;
                }).join('');
            } else {
                phaseList.innerHTML = `<p class="text-gray-400 py-12 text-center">暫無階段資料</p>`;
            }

            document.getElementById('editBtn').href = `edit_project.html?id=${projectId}`;
            document.getElementById('addPhaseBtn').href = `create_phase.html?id=${projectId}`;

            window.deleteProject = function() {
                if (!confirm('⚠️ 警告！\n\n確定要永久刪除這個項目嗎？\n\n此操作無法恢復，所有階段資料也會一併刪除！')) return;
                projects.splice(projectIndex, 1);
                localStorage.setItem('pmis_projects', JSON.stringify(projects));
                alert('🗑️ 項目已成功刪除！');
                location.href = 'main.html';
            };

if (localStorage.getItem('accessLevel') === 'admin') {
    // 新增階段
    const addPhase = document.getElementById('addPhaseBtn');
    if (addPhase) {
        addPhase.classList.add('opacity-50', 'cursor-not-allowed', '!bg-slate-300', '!text-slate-500');
        addPhase.href = '#';
        addPhase.onclick = () => alert('無法新增階段');
    }
    // 階段編輯按鈕
    document.querySelectorAll('a[href^="edit_phase.html"]').forEach(a => {
        a.classList.add('opacity-50', 'cursor-not-allowed', '!bg-slate-300', '!text-slate-500');
        a.href = '#';
        a.onclick = () => alert('無法編輯階段');
    // 訪客模式：灰色禁用「編輯項目」和「刪除項目」
    const editBtn = document.getElementById('editBtn');
    if (editBtn) {
        editBtn.classList.add('!bg-slate-300', '!text-slate-500', '!cursor-not-allowed', 'opacity-50');
        editBtn.href = '#';
        editBtn.onclick = () => alert('無法編輯項目');
    }
    // 禁用刪除項目按鈕
    const deleteBtn = document.querySelector('button[onclick="deleteProject()"]');
    if (deleteBtn) {
        deleteBtn.classList.add('!bg-slate-300', '!text-slate-500', '!cursor-not-allowed', 'opacity-50');
        deleteBtn.onclick = () => alert('無法刪除項目');
    }
    });
}


            // Sidebar 控制
            let isCollapsed = localStorage.getItem('sidebarCollapsed') !== 'false';
            const sidebar = document.getElementById('sidebarFrame');
            const main = document.querySelector('.main-content');
            const toggleBtn = document.getElementById('toggleSidebar');

            function updateSidebar() {
                const w = isCollapsed ? '54px' : '260px';
                const m = isCollapsed ? '54px' : '260px';
                sidebar.style.width = w;
                main.style.marginLeft = m;
            }

            toggleBtn.addEventListener('click', () => {
                isCollapsed = !isCollapsed;
                localStorage.setItem('sidebarCollapsed', isCollapsed);
                updateSidebar();
            });

            sidebar.addEventListener('load', () => setTimeout(updateSidebar, 100));
            updateSidebar();
        });
    </script>
</body>
</html>
